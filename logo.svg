<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 220" width="820" height="220">
  <defs>
    <!-- Gradient for the geometric shape -->
    <linearGradient id="geoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C0392B"/>
      <stop offset="50%" stop-color="#A93226"/>
      <stop offset="100%" stop-color="#8B1A1A"/>
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E74C3C"/>
      <stop offset="100%" stop-color="#F39C12"/>
    </linearGradient>
    <linearGradient id="innerGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E74C3C" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#F39C12" stop-opacity="0.08"/>
    </linearGradient>
  </defs>

  <!-- ==================== GEOMETRIC ICON ==================== -->
  <g transform="translate(30, 10)">
    <!-- Outer hexagon shell -->
    <polygon 
      points="100,8 168,47 168,125 100,164 32,125 32,47" 
      fill="none" 
      stroke="url(#geoGrad)" 
      stroke-width="2.8"
      stroke-linejoin="round"
    />

    <!-- Subtle inner fill -->
    <polygon 
      points="100,8 168,47 168,125 100,164 32,125 32,47" 
      fill="url(#innerGrad)"
    />

    <!-- Internal wireframe structure - icosahedron-inspired -->
    <!-- Top triangle -->
    <polygon points="100,8 68,55 132,55" fill="none" stroke="url(#geoGrad)" stroke-width="1.6" stroke-linejoin="round"/>
    <!-- Bottom triangle -->
    <polygon points="100,164 68,117 132,117" fill="none" stroke="url(#geoGrad)" stroke-width="1.6" stroke-linejoin="round"/>
    <!-- Middle band - left -->
    <line x1="68" y1="55" x2="32" y2="47" stroke="url(#geoGrad)" stroke-width="1.6"/>
    <line x1="68" y1="55" x2="32" y2="125" stroke="url(#geoGrad)" stroke-width="1.6"/>
    <line x1="68" y1="117" x2="32" y2="125" stroke="url(#geoGrad)" stroke-width="1.6"/>
    <line x1="68" y1="117" x2="32" y2="47" stroke="url(#geoGrad)" stroke-width="1.6"/>
    <!-- Middle band - right -->
    <line x1="132" y1="55" x2="168" y2="47" stroke="url(#geoGrad)" stroke-width="1.6"/>
    <line x1="132" y1="55" x2="168" y2="125" stroke="url(#geoGrad)" stroke-width="1.6"/>
    <line x1="132" y1="117" x2="168" y2="125" stroke="url(#geoGrad)" stroke-width="1.6"/>
    <line x1="132" y1="117" x2="168" y2="47" stroke="url(#geoGrad)" stroke-width="1.6"/>
    <!-- Cross struts -->
    <line x1="68" y1="55" x2="132" y2="117" stroke="url(#geoGrad)" stroke-width="1.2" opacity="0.6"/>
    <line x1="132" y1="55" x2="68" y2="117" stroke="url(#geoGrad)" stroke-width="1.2" opacity="0.6"/>
    <!-- Vertical spine -->
    <line x1="100" y1="8" x2="100" y2="164" stroke="url(#geoGrad)" stroke-width="1.0" opacity="0.35"/>
    <!-- Top connections to mid-vertices -->
    <line x1="100" y1="8" x2="168" y2="47" stroke="url(#geoGrad)" stroke-width="1.4" opacity="0.5"/>
    <line x1="100" y1="8" x2="32" y2="47" stroke="url(#geoGrad)" stroke-width="1.4" opacity="0.5"/>
    <!-- Bottom connections -->
    <line x1="100" y1="164" x2="168" y2="125" stroke="url(#geoGrad)" stroke-width="1.4" opacity="0.5"/>
    <line x1="100" y1="164" x2="32" y2="125" stroke="url(#geoGrad)" stroke-width="1.4" opacity="0.5"/>

    <!-- Vertex dots -->
    <g fill="#C0392B">
      <circle cx="100" cy="8" r="3.5"/>
      <circle cx="168" cy="47" r="3.5"/>
      <circle cx="168" cy="125" r="3.5"/>
      <circle cx="100" cy="164" r="3.5"/>
      <circle cx="32" cy="125" r="3.5"/>
      <circle cx="32" cy="47" r="3.5"/>
      <circle cx="68" cy="55" r="3"/>
      <circle cx="132" cy="55" r="3"/>
      <circle cx="68" cy="117" r="3"/>
      <circle cx="132" cy="117" r="3"/>
    </g>

    <!-- Spark accent - small starburst at top-right -->
    <g transform="translate(158, 18)" opacity="0.9">
      <line x1="0" y1="-8" x2="0" y2="8" stroke="url(#sparkGrad)" stroke-width="2" stroke-linecap="round"/>
      <line x1="-8" y1="0" x2="8" y2="0" stroke="url(#sparkGrad)" stroke-width="2" stroke-linecap="round"/>
      <line x1="-5.5" y1="-5.5" x2="5.5" y2="5.5" stroke="url(#sparkGrad)" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="5.5" y1="-5.5" x2="-5.5" y2="5.5" stroke="url(#sparkGrad)" stroke-width="1.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- ==================== WORDMARK ==================== -->
  <g transform="translate(245, 68)">
    <!-- MATH -->
    <text 
      font-family="'Montserrat', 'Helvetica Neue', sans-serif" 
      font-weight="700" 
      font-size="72" 
      letter-spacing="6"
      fill="#8B1A1A"
    >MATH</text>
    <!-- SPARK -->
    <text 
      x="252" 
      font-family="'Montserrat', 'Helvetica Neue', sans-serif" 
      font-weight="700" 
      font-size="72" 
      letter-spacing="6"
      fill="url(#sparkGrad)"
    >SPARK</text>
  </g>

  <!-- Tagline -->
  <text 
    x="245" 
    y="108"
    font-family="'Montserrat', 'Helvetica Neue', sans-serif" 
    font-weight="400" 
    font-size="14.5" 
    letter-spacing="5.5"
    fill="#A0A0A0"
  >IGNITE YOUR POTENTIAL</text>
</svg>
