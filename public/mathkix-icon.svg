<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="blueGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#6B9FFF"/>
      <stop offset="100%" stop-color="#3256CC"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFD060"/>
      <stop offset="100%" stop-color="#F59000"/>
    </linearGradient>
    <clipPath id="goldClip">
      <rect x="0" y="106" width="200" height="100"/>
    </clipPath>
  </defs>
  <!-- Blue chevron / house-roof shape -->
  <polygon points="100,14 184,88 184,106 16,106 16,88" fill="url(#blueGrad)"/>
  <!-- Gold semicircle (bottom half) -->
  <circle cx="100" cy="106" r="84" fill="url(#goldGrad)" clip-path="url(#goldClip)"/>
</svg>
