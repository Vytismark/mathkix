<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" width="520" height="160">
  <defs>
    <linearGradient id="blueGradL" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#6B9FFF"/>
      <stop offset="100%" stop-color="#3256CC"/>
    </linearGradient>
    <linearGradient id="goldGradL" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFD060"/>
      <stop offset="100%" stop-color="#F59000"/>
    </linearGradient>
    <clipPath id="goldClipL">
      <rect x="0" y="91" width="160" height="80"/>
    </clipPath>
  </defs>

  <!-- ===== ICON ===== -->
  <!-- Blue chevron -->
  <polygon points="80,10 148,80 148,92 12,92 12,80" fill="url(#blueGradL)"/>
  <!-- Gold semicircle -->
  <circle cx="80" cy="91" r="68" fill="url(#goldGradL)" clip-path="url(#goldClipL)"/>

  <!-- ===== WORDMARK ===== -->
  <!-- "Math" — bold, dark text for light backgrounds -->
  <text
    x="178"
    y="112"
    font-family="'Nunito', 'Geist', 'Helvetica Neue', Arial, sans-serif"
    font-weight="800"
    font-size="82"
    fill="#0D1B2A"
    letter-spacing="-2"
  >Math</text>
  <!-- "Kix" — light weight, dark text -->
  <text
    x="350"
    y="112"
    font-family="'Nunito', 'Geist', 'Helvetica Neue', Arial, sans-serif"
    font-weight="300"
    font-size="82"
    fill="#0D1B2A"
    letter-spacing="-2"
  >Kix</text>
</svg>
